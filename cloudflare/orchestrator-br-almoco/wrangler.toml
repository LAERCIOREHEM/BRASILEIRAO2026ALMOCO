name = "brasileirao-almoco-orchestrator"
main = "src/index.js"
compatibility_date = "2026-09-03"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
# O workflow de deploy troca SOMENTE esta linha no workspace antes do deploy.
ORCHESTRATOR_MODE = "shadow"
GITHUB_REPOSITORY = "LAERCIOREHEM/BRASILEIRAO2026ALMOCO"
GITHUB_BRANCH = "main"
SLOW_INTERVAL_MINUTES = "30"
SLOW_RETRY_ERROR_MINUTES = "5"
FAST_PROBE_START_MINUTES = "88"
FAST_PROBE_END_MINUTES = "300"
FAST_PROBE_INTERVAL_SECONDS = "60"
FINAL_RECOVERY_END_MINUTES = "720"
FINAL_RECOVERY_INTERVAL_MINUTES = "5"
FINAL_DEBOUNCE_SECONDS = "0"
FINAL_RETRY_MINUTES = "3"
FINAL_SAFETY_START_MINUTES = "110"
FINAL_SAFETY_RETRY_MINUTES = "5"
FAST_COOLDOWN_MINUTES = "3"
MAIN_COOLDOWN_MINUTES = "8"
APURACAO_COOLDOWN_MINUTES = "10"
BLOCKS_COOLDOWN_MINUTES = "10"
AF_COOLDOWN_MINUTES = "20"
AF_SAME_DIVERGENCE_BACKOFF_MINUTES = "120"
TV_CRITICAL_RETRY_HOURS = "3"
TV_14D_RETRY_HOURS = "24"
TV_35D_RETRY_HOURS = "48"
TV_FULL_COVERAGE_RECHECK_HOURS = "72"
MAINTENANCE_MAX_HOURS = "24"
MAINTENANCE_PENDING_CALENDAR_HOURS = "12"
MAINTENANCE_NEAR_GAME_HOURS = "12"
MAINTENANCE_NEAR_GAME_WINDOW_HOURS = "36"
MAINTENANCE_VERY_NEAR_HOURS = "6"
MAINTENANCE_VERY_NEAR_WINDOW_HOURS = "8"
STALE_CACHE_MAX_HOURS_FOR_FINAL = "6"
BLOCK_BOUNDARY_BEFORE_MINUTES = "5"
BLOCK_BOUNDARY_AFTER_MINUTES = "20"
BLOCK_SAFETY_NEAR_DAYS = "7"
BLOCK_SAFETY_NEAR_HOURS = "72"
BLOCK_SAFETY_FAR_HOURS = "168"
BLOCK_PAST_DUE_RETRY_HOURS = "1"
BLOCKS_FAILURE_BACKOFF_HOURS = "6"
DUPLICATE_RUN_GUARD_MINUTES = "15"
GITHUB_RUNS_LIMIT = "50"
RECENT_DECISIONS_LIMIT = "20"

[[durable_objects.bindings]]
name = "ORCHESTRATOR_STATE"
class_name = "BrAlmocoOrchestratorStateV1"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrAlmocoOrchestratorStateV1"]
