name: Buscar transmissões ao vivo do Brasileirão
run-name: Transmissões · ${{ inputs.modo || 'tv' }} · ${{ inputs.event_id || 'todos' }}

on:
  # Sem schedule e sem push automático. O orquestrador chama somente modo=tv,
  # uma vez ao dia. O modo aovivo fica disponível apenas para execução manual.
  workflow_dispatch:
    inputs:
      modo:
        description: 'tv = grade futura; aovivo = player GE TV/CazéTV; completo = ambos'
        required: true
        default: 'tv'
        type: choice
        options:
          - tv
          - aovivo
          - completo
      event_id:
        description: 'Opcional: pesquisar apenas um event_id da ESPN no modo aovivo'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Somente auditar, sem gravar nem publicar'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  buscar:
    name: Atualizar somente a transmissão necessária
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cliente HTTP com fingerprint de navegador
        run: python -m pip install --disable-pip-version-check --no-cache-dir curl-cffi==0.15.0

      - name: Validar scripts e configuração
        run: |
          set -euo pipefail
          python -m py_compile scripts/buscar_transmissoes_aovivo_brasileirao.py
          python scripts/buscar_transmissoes_aovivo_brasileirao.py --selftest
          python -m py_compile scripts/atualizar_transmissoes_tv_brasileirao.py
          python scripts/atualizar_transmissoes_tv_brasileirao.py --selftest
          python -m json.tool dados-br/config-transmissoes-aovivo.json > /dev/null
          python -m json.tool dados-br/config-transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/transmissoes-aovivo.json > /dev/null
          python -m json.tool dados-br/transmissoes-aovivo-manual.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-aovivo.json > /dev/null
          python -m json.tool dados-br/transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-tv.json > /dev/null
          python -m json.tool transmissoes.json > /dev/null

      - name: Buscar transmissões oficiais
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INPUT_MODO: ${{ inputs.modo }}
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          MODO="${INPUT_MODO:-tv}"

          if [[ "$MODO" != "tv" ]]; then
            CMD=(python scripts/buscar_transmissoes_aovivo_brasileirao.py)
            if [[ -n "${INPUT_EVENT_ID:-}" ]]; then
              CMD+=(--event-id "${INPUT_EVENT_ID}")
            fi
            if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
              CMD+=(--dry-run)
            fi
            echo "Executando player ao vivo: ${CMD[*]}"
            "${CMD[@]}"
          else
            echo "Modo tv: busca de player GE TV/CazéTV desativada."
          fi

          if [[ "$MODO" != "aovivo" ]]; then
            TV_CMD=(python scripts/atualizar_transmissoes_tv_brasileirao.py)
            if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
              TV_CMD+=(--dry-run)
            fi
            echo "Executando grade de TV: ${TV_CMD[*]}"
            "${TV_CMD[@]}"
          else
            echo "Modo aovivo: grade de TV preservada."
          fi

      - name: Validar relatórios gerados
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          python -m json.tool dados-br/transmissoes-aovivo.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-aovivo.json > /dev/null
          python -m json.tool dados-br/transmissoes-tv.json > /dev/null
          python -m json.tool dados-br/auditoria-transmissoes-tv.json > /dev/null
          python - <<'PY'
          import json
          from urllib.parse import urlparse, parse_qs
          from scripts.atualizar_transmissoes_tv_brasileirao import ALLOWED_CHANNELS

          out = json.load(open('dados-br/transmissoes-aovivo.json', encoding='utf-8'))
          assert isinstance(out.get('jogos'), dict), 'transmissoes-aovivo.json sem objeto jogos'
          for event_id, jogo in out['jogos'].items():
              assert str(jogo.get('event_id')) == str(event_id), f'event_id divergente em {event_id}'
              principal = jogo.get('principal')
              assert isinstance(principal, dict), f'{event_id}: sem principal válido'
              assert principal.get('fonte') in {'cazetv', 'getv'}, f'{event_id}: fonte não permitida'
              parsed = urlparse(principal.get('url', ''))
              assert parsed.netloc.lower() in {'www.youtube.com', 'youtube.com'}, f'{event_id}: URL fora do YouTube'
              assert parse_qs(parsed.query).get('v'), f'{event_id}: URL sem video_id'
              if jogo.get('alternativas'):
                  assert principal.get('fonte') == 'cazetv', f'{event_id}: com duas fontes, CazéTV deve ser principal'

          aud = json.load(open('dados-br/auditoria-transmissoes-aovivo.json', encoding='utf-8'))
          assert isinstance(aud.get('resumo'), dict)
          assert isinstance(aud.get('rejeitados'), list)
          assert isinstance(aud.get('sem_transmissao'), list)

          tv = json.load(open('dados-br/transmissoes-tv.json', encoding='utf-8'))
          assert isinstance(tv.get('jogos'), dict), 'transmissoes-tv.json sem objeto jogos'
          for event_id, jogo in tv['jogos'].items():
              assert str(jogo.get('event_id')) == str(event_id)
              assert jogo.get('canais')
              assert jogo.get('confianca') in {'confirmado', 'manual', 'preservado'}
              assert isinstance(jogo.get('fontes'), list) and jogo['fontes']
              invalidos = set(jogo['canais']) - ALLOWED_CHANNELS
              assert not invalidos, f'TV: canal não permitido em {event_id}: {sorted(invalidos)}'

          aud_tv = json.load(open('dados-br/auditoria-transmissoes-tv.json', encoding='utf-8'))
          resumo = aud_tv.get('resumo') or {}
          assert isinstance(aud_tv.get('fontes'), dict)
          assert isinstance(aud_tv.get('sem_transmissao'), list)
          assert int(resumo.get('jogos_com_transmissao') or 0) == len(tv['jogos'])
          print(f"Transmissões validadas; críticos <72h sem canal: {int(resumo.get('jogos_criticos_sem_transmissao_72h') or 0)}")
          PY

      - name: Commitar somente quando houver mudança real
        id: publish
        if: ${{ inputs.dry_run != true }}
        env:
          INPUT_MODO: ${{ inputs.modo }}
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MODO="${INPUT_MODO:-tv}"
          FILES=()
          if [[ "$MODO" != "tv" ]]; then
            FILES+=("dados-br/transmissoes-aovivo.json" "dados-br/auditoria-transmissoes-aovivo.json")
          fi
          if [[ "$MODO" != "aovivo" ]]; then
            FILES+=("dados-br/transmissoes-tv.json" "dados-br/auditoria-transmissoes-tv.json")
          fi
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "Nenhum artefato selecionado."
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Nenhuma mudança de transmissão."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Origin/main já possui o mesmo conteúdo."
              exit 0
            fi
            git add -- "${FILES[@]}"
            git commit -m "Atualizar transmissões Brasileirão (${MODO}) - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: push falhou após 5 tentativas."
          exit 1

      - name: Disparar deploy após transmissão publicada
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para a atualização de transmissão."
