name: Recuperar fila GitHub Pages

on:
  workflow_dispatch:
    inputs:
      disparar_deploy_limpo:
        description: 'Depois da limpeza, disparar um único deploy forçado'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pages: write
  deployments: read

concurrency:
  group: pages-recovery
  cancel-in-progress: false

jobs:
  recuperar:
    name: Recuperação limitada da fila
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verificar rate limit antes de qualquer varredura
        id: rate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(gh api rate_limit)
          REMAINING=$(printf '%s' "$JSON" | jq -r '.resources.core.remaining // 0')
          RESET=$(printf '%s' "$JSON" | jq -r '.resources.core.reset // 0')
          echo "remaining=${REMAINING}"
          echo "reset=${RESET}"
          if (( REMAINING < 80 )); then
            RESET_HUMAN=$(date -u -d "@${RESET}" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "$RESET")
            echo "ERRO: rate limit muito baixo (${REMAINING}). Aguarde o reset em ${RESET_HUMAN}."
            echo "Nenhuma limpeza foi iniciada para não piorar o bloqueio."
            exit 1
          fi

      - name: Forçar cancelamento de runs ativos do Deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml" --jq '.id')
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id' > /tmp/ativos.txt
          total=0
          while IFS= read -r run_id; do
            [[ -z "${run_id:-}" ]] && continue
            echo "Force-cancel run ${run_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1 \
              || gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 \
              || true
            total=$((total + 1))
          done < /tmp/ativos.txt
          echo "Runs ativos tratados: ${total}."

      - name: Cancelar somente deployments Pages recentes ainda ativos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Limite rígido: no máximo 20 status lookups, uma única passagem.
          # O R1 fazia até 100 x 13 consultas por run e estourava a API.
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=20" \
            --jq '.[] | [.id, .sha, .created_at] | @tsv' > /tmp/pages.tsv
          total=0
          while IFS=$'\t' read -r id sha criado; do
            [[ -z "${id:-}" ]] && continue
            estado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" \
              --jq '.[0].state // "sem_status"' 2>/dev/null || echo "sem_status")
            case "$estado" in
              queued|in_progress|pending|waiting)
                echo "Cancelando deployment id=${id} sha=${sha} estado=${estado} criado=${criado}"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel" >/dev/null 2>&1 \
                  || gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" >/dev/null 2>&1 \
                  || true
                total=$((total + 1))
                ;;
            esac
          done < /tmp/pages.tsv
          echo "Deployments recentes tratados: ${total}."
          echo "Aguardando 30s para a fila serial do Pages absorver os cancelamentos."
          sleep 30

      - name: Disparar um único deploy forçado
        if: inputs.disparar_deploy_limpo == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main -f forcar=true
          echo "OK: um único Deploy site foi solicitado."
