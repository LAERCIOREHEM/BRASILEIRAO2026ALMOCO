name: Apurar Apostas Brasileirão

on:
  # O fluxo normal roda dentro de Atualizar Brasileirao, no mesmo snapshot do
  # resultado. Este workflow é a recuperação leve: o orquestrador o chama se a
  # pontuação ficar atrás dos resultados, sem refazer ESPN/AF/estatísticas.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  apurar:
    runs-on: ubuntu-latest
    # Era 15 min. Duas execucoes morreram exatamente em 15m06s e outra em
    # 28m14s (13 min de espera na fila repo-write-main + 15 min de execucao
    # ate o corte). O trabalho de apuracao nao cabia no limite. Com o clone
    # raso a execucao encurta bastante, mas a margem fica explicita.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 1 — nenhum workflow ou script deste repositorio le
          # historico do git (nao ha git log / rev-list / describe / blame em
          # lugar nenhum). Com fetch-depth: 1 cada execucao clonava o historico
          # inteiro de um repositorio com 212 MB de arvore de trabalho e
          # milhares de commits de robo — custo puro, pago em toda execucao.
          # Os laços de push robusto usam 'git fetch origin main' +
          # 'git reset --hard origin/main', que funcionam em clone raso.
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar regras da Execução 4.1
        run: |
          python -m py_compile scripts/apurar_rodada.py
          python scripts/apurar_rodada.py --self-test

      - name: Apurar rodadas, blocos e rankings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRASILEIRAO_TEMPORADA: '2026'
        run: python scripts/apurar_rodada.py

      - name: Validar JSONs gerados
        run: |
          python -m json.tool dados-br/apuracao.json > /dev/null
          python -m json.tool dados-br/ranking-apostas.json > /dev/null
          python - <<'PY'
          import json
          ap = json.load(open('dados-br/apuracao.json', encoding='utf-8'))
          rk = json.load(open('dados-br/ranking-apostas.json', encoding='utf-8'))
          resultados = json.load(open('resultados.json', encoding='utf-8'))
          assert ap.get('schema_version') == 4
          assert rk.get('schema_version') == 4
          assert len(ap.get('blocos') or []) == 6
          assert (ap.get('validacao_resultados') or {}).get('somente_finalizados') is True
          assert all(not b.get('concluido') or int(b.get('jogos_apurados') or 0) == 30 for b in ap.get('blocos') or [])

          r20 = next((r for r in ap.get('rodadas') or [] if int(r.get('rodada') or 0) == 20), None)
          finais_r20 = [r for r in resultados.get('resultados') or [] if int(r.get('rodada') or 0) == 20]
          if r20 and int(r20.get('participantes') or 0) > 0 and len(finais_r20) >= 10:
              assert r20.get('publicada') is True, 'Rodada 20 encerrada voltou a ficar sigilosa.'
              assert int(r20.get('jogos_apurados') or 0) == 10, 'Rodada 20 não apurou os dez jogos.'
              assert r20.get('ranking'), 'Ranking da Rodada 20 ficou vazio apesar dos palpites e resultados.'
          print('JSONs de apuração e regressão da Rodada 20 validados.')
          PY

      - name: Publicar apuração com push robusto
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=("dados-br/apuracao.json" "dados-br/ranking-apostas.json")
          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Nenhuma alteração de apuração."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TMP_DIR/dados-br"
          cp -a dados-br/apuracao.json "$TMP_DIR/dados-br/apuracao.json"
          cp -a dados-br/ranking-apostas.json "$TMP_DIR/dados-br/ranking-apostas.json"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p dados-br
            cp -a "$TMP_DIR/dados-br/apuracao.json" dados-br/apuracao.json
            cp -a "$TMP_DIR/dados-br/ranking-apostas.json" dados-br/ranking-apostas.json

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro fluxo já publicou a mesma apuração."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Atualizar apuração e rankings do Brasileirão - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "ERRO: não foi possível publicar a apuração após 5 tentativas."
          exit 1

      - name: Disparar deploy após apuração publicada
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para a apuração recuperada."
