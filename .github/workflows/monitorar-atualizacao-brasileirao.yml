name: Monitorar Atualizar Brasileirao (desativado)

on:
  # Workflow legado mantido apenas para deixar explícito no painel que o
  # monitor automático foi substituído pelo job alertar_falha do workflow
  # Atualizar Brasileirao (ESPN). Não envia e-mail nem altera o repositório.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informar:
    name: Informar mecanismo vigente
    runs-on: ubuntu-latest
    # Sem limite, um job travado prende o runner por ate 6 horas.
    timeout-minutes: 10
    steps:
      - name: Exibir orientação
        run: |
          echo "Este monitor legado está desativado."
          echo "Falhas reais são alertadas pelo job alertar_falha de atualizar-brasileirao.yml."
          echo "Atualizações normais, avisos e fallbacks auditados não enviam e-mail."
