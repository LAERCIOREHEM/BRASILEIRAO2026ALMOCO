name: Auditoria IA diária das apostas

on:
  schedule:
    # 08:45 em Brasília (UTC-3). A IA é apenas a última camada do dia.
    - cron: '45 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-ia-apostas-diaria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar camada IA offline
        run: |
          set -euo pipefail
          python -m py_compile scripts/auditoria_ia_apostas.py
          python scripts/auditoria_ia_apostas.py --self-test

      - name: Reservar persistentemente a única chamada OpenAI do dia
        id: ai_gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "run_daily=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY ausente: nenhuma chamada será feita e nenhum lock será reservado."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          LOCK="dados-br/auditoria-ia-apostas-lock.json"
          DATA_BRT="$(TZ='America/Sao_Paulo' date '+%F')"
          lock_de_hoje() { [[ -f "$LOCK" ]] && [[ "$(jq -r '.data_brt // ""' "$LOCK" 2>/dev/null || true)" == "$DATA_BRT" ]]; }
          if lock_de_hoje; then
            echo "run_daily=false" >> "$GITHUB_OUTPUT"
            echo "Chamada de $DATA_BRT já reservada."
            exit 0
          fi
          mkdir -p dados-br
          jq -n --arg data "$DATA_BRT" --arg run "$GITHUB_RUN_ID" --arg em "$(TZ='America/Sao_Paulo' date --iso-8601=seconds)" \
            '{schema_version:1,data_brt:$data,reservado_em:$em,github_run_id:$run}' > "$LOCK"
          TMP="$(mktemp)"; cp "$LOCK" "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            if lock_de_hoje; then
              echo "run_daily=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            mkdir -p dados-br; cp "$TMP" "$LOCK"
            git add -- "$LOCK"
            git commit -m "Reservar auditoria IA das apostas - $DATA_BRT"
            if git push origin HEAD:main; then
              echo "run_daily=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "run_daily=false" >> "$GITHUB_OUTPUT"
          echo "Falha ao persistir lock; API não será chamada para evitar duplicidade." >&2
          exit 1

      - name: Executar auditoria IA agregada
        if: steps.ai_gate.outputs.run_daily == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-5.6-terra' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: python scripts/auditoria_ia_apostas.py

      - name: Validar artefato IA
        if: steps.ai_gate.outputs.run_daily == 'true'
        run: |
          set -euo pipefail
          python -m json.tool dados-br/auditoria-ia-apostas.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('dados-br/auditoria-ia-apostas.json',encoding='utf-8'))
          assert d.get('schema_version') == 1
          assert d.get('status') in {'ok','warning','critical'}
          assert (d.get('politica') or {}).get('maximo_chamadas_dia') == 1
          assert (d.get('politica') or {}).get('dados_individuais_palpites') is False
          assert (d.get('politica') or {}).get('poder_de_escrita_ia') is False
          PY

      - name: Publicar auditoria IA
        if: steps.ai_gate.outputs.run_daily == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          FILE="dados-br/auditoria-ia-apostas.json"
          if [[ -z "$(git status --porcelain -- "$FILE")" ]]; then exit 0; fi
          TMP="$(mktemp)"; cp "$FILE" "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p dados-br; cp "$TMP" "$FILE"
            if [[ -z "$(git status --porcelain -- "$FILE")" ]]; then exit 0; fi
            git add -- "$FILE"
            git commit -m "Auditoria IA diária das apostas - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y')"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Alertar falha do próprio workflow
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key=os.getenv('RESEND_API_KEY','').strip(); dest=os.getenv('EMAIL_DESTINO','').strip()
          if not key or not dest: raise SystemExit(0)
          sender=os.getenv('EMAIL_REMETENTE','').strip() or 'Auditoria IA · Brasileirão 2026 <avisos@brasileirao2026almoco.com.br>'
          url=os.getenv('RUN_URL','')
          body=json.dumps({'from':sender,'to':[dest],'subject':'[BR2026 Almoço] Falha na auditoria IA das apostas','html':f'<h2>Falha operacional na auditoria IA</h2><p>A camada de IA falhou. A automação determinística das apostas continua independente.</p><p><a href="{url}">Abrir GitHub Actions</a></p>'}).encode()
          req=urllib.request.Request('https://api.resend.com/emails',data=body,headers={'Authorization':f'Bearer {key}','Content-Type':'application/json'},method='POST')
          urllib.request.urlopen(req,timeout=20).read()
          PY
