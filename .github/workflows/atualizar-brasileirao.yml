name: Atualizar Brasileirao (ESPN)

on:
  # Execução operacional por workflow_dispatch. O orquestrador inteligente é o
  # único gatilho automático; o botão "Run workflow" continua disponível.
  # Não há schedule interno nem cron externo direto neste workflow.
  workflow_dispatch:
    inputs:
      forcar_af:
        description: 'Forçar o AF-Previsão mesmo sem mudança esportiva relevante'
        required: false
        default: false
        type: boolean
      coleta_completa:
        description: 'Forçar varredura completa do scoreboard ESPN nesta execução'
        required: false
        default: true
        type: boolean
      event_ids:
        description: 'event_id(s) ESPN para reconciliação direta via summary; uso do orquestrador'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# GRUPO GLOBAL DE ESCRITA (repo-write-main) — o mesmo dos demais workflows
# que dao git push no main. Serializa as escritas -> zero corrida de push.
concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  atualizar:
    name: Buscar dados ESPN e publicar JSONs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # fetch-depth: 1 — nenhum workflow ou script deste repositorio le
          # historico do git (nao ha git log / rev-list / describe / blame em
          # lugar nenhum). Com fetch-depth: 1 cada execucao clonava o historico
          # inteiro de um repositorio com 212 MB de arvore de trabalho e
          # milhares de commits de robo — custo puro, pago em toda execucao.
          # Os laços de push robusto usam 'git fetch origin main' +
          # 'git reset --hard origin/main', que funcionam em clone raso.
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-af-previsao.txt

      - name: Instalar dependências do AF-Previsão e coleta web
        run: |
          python -m pip install --disable-pip-version-check -r requirements-af-previsao.txt
          python -m pip install --disable-pip-version-check --no-cache-dir curl-cffi==0.15.0

      - name: Mostrar horario da execucao
        run: |
          echo "Horario UTC:"
          date -u '+%d/%m/%Y %H:%M:%S UTC'
          echo "Horario Brasilia:"
          TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M:%S BRT'

      - name: Validar sintaxe e parsers estatísticos
        run: |
          python -m py_compile \
            atualizar_espn.py \
            fontes_brasileirao.py \
            scripts/gerenciar_status_brasileirao.py \
            scripts/buscar_lideres_jogadores_espn.py \
            scripts/buscar_detalhes_jogos_brasileirao.py \
            scripts/gerar_estatisticas_brasileirao.py \
            scripts/gerar_estatisticas_competicao_brasileirao.py \
            scripts/gerar_auditoria_estatisticas_brasileirao.py \
            scripts/gerar_auditoria_calendario.py \
            scripts/gerar_auditoria_geral.py \
            scripts/sincronizar_blocos_apostas.py \
            scripts/af_previsao_backtest.py \
            scripts/af_previsao_continental.py \
            scripts/atualizar_competicoes_af_previsao.py \
            scripts/gerar_probabilidades_brasileirao.py \
            scripts/gerar_probabilidades_jogos.py \
            scripts/avaliar_af_previsao.py \
            scripts/apurar_rodada.py
          python atualizar_espn.py --selftest
          python fontes_brasileirao.py --selftest
          python scripts/gerenciar_status_brasileirao.py --selftest
          python scripts/buscar_lideres_jogadores_espn.py --self-test
          python scripts/buscar_detalhes_jogos_brasileirao.py --self-test
          python scripts/gerar_auditoria_estatisticas_brasileirao.py --self-test
          python scripts/gerar_auditoria_calendario.py --self-test
          python scripts/gerar_auditoria_geral.py --self-test
          python scripts/sincronizar_blocos_apostas.py --self-test
          python scripts/atualizar_competicoes_af_previsao.py --self-test
          python scripts/af_previsao_continental.py --self-test
          python scripts/gerar_probabilidades_brasileirao.py --self-test
          python scripts/gerar_probabilidades_jogos.py --self-test
          python scripts/avaliar_af_previsao.py --self-test
          python scripts/apurar_rodada.py --self-test

      - name: Registrar estado esportivo anterior do AF-Previsão
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          digest = hashlib.sha256(bruto).hexdigest()
          Path('/tmp/af_estado_antes.sha256').write_text(digest, encoding='utf-8')
          resultados_bruto = json.dumps(estado.get('resultados') or [], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          resultados_digest = hashlib.sha256(resultados_bruto).hexdigest()
          Path('/tmp/resultados_antes.sha256').write_text(resultados_digest, encoding='utf-8')
          print(f'Estado anterior do AF: {digest}')
          print(f'Resultados anteriores: {resultados_digest}')
          PY

      # --- DADOS DO BRASILEIRAO ---
      # A ESPN permanece como fonte principal. Somente quando a auditoria não
      # fecha, o coletor tenta summary ESPN, CBF oficial, API-Football opcional
      # e, por último, override manual. Os quatro JSONs são gravados juntos.
      - name: Atualizar tabela, jogos, resultados e eventos
        id: espn
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_LEAGUE_ID: ${{ secrets.API_FOOTBALL_LEAGUE_ID }}
          ESPN_COLETA_COMPLETA: ${{ inputs.coleta_completa }}
          ESPN_FORCE_SUMMARY_EVENT_IDS: ${{ inputs.event_ids }}
        run: python atualizar_espn.py

      # Publicação prioritária: resultado final e ranking parcial não aguardam
      # estatísticas, vídeos, competições continentais nem o AF-Previsão.
      - name: Registrar saúde da coleta essencial
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Brasileirão 2026 Almoço
        run: python scripts/gerenciar_status_brasileirao.py --from-env

      - name: Detectar mudança real de resultados
        id: resultado_gate
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('resultados.json').read_text(encoding='utf-8'))
          linhas = payload.get('resultados') or []
          bruto = json.dumps(linhas, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          depois = hashlib.sha256(bruto).hexdigest()
          antes = Path('/tmp/resultados_antes.sha256').read_text(encoding='utf-8').strip()
          mudou = antes != depois
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"mudou={str(mudou).lower()}\n")
          print(f'Resultados antes: {antes}')
          print(f'Resultados depois: {depois}')
          print('Mudança esportiva de resultados:', mudou)
          PY

      - name: Sincronizar blocos de apostas e avisar nova abertura
        id: sync_blocos
        if: steps.espn.outputs.sincronizado == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          BRASILEIRAO_TEMPORADA: '2026'
        run: python scripts/sincronizar_blocos_apostas.py

      - name: Apurar ranking parcial no mesmo snapshot essencial
        id: apurar_essencial
        if: steps.espn.outputs.sincronizado == 'true' && steps.resultado_gate.outputs.mudou == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRASILEIRAO_TEMPORADA: '2026'
        run: python scripts/apurar_rodada.py

      - name: Atualizar auditoria dos blocos após apuração
        if: steps.espn.outputs.sincronizado == 'true' && steps.resultado_gate.outputs.mudou == 'true' && steps.apurar_essencial.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          BRASILEIRAO_TEMPORADA: '2026'
        run: python scripts/sincronizar_blocos_apostas.py

      - name: Validar resultado e ranking parcial essenciais
        if: steps.espn.outputs.sincronizado == 'true' && steps.resultado_gate.outputs.mudou == 'true' && steps.apurar_essencial.outcome == 'success'
        run: |
          python -m json.tool tabela.json > /dev/null
          python -m json.tool espn_eventos.json > /dev/null
          python -m json.tool jogos.json > /dev/null
          python -m json.tool resultados.json > /dev/null
          python -m json.tool dados-br/apuracao.json > /dev/null
          python -m json.tool dados-br/ranking-apostas.json > /dev/null
          python - <<'PY'
          import json

          resultados = json.load(open('resultados.json', encoding='utf-8'))
          apuracao = json.load(open('dados-br/apuracao.json', encoding='utf-8'))
          ranking = json.load(open('dados-br/ranking-apostas.json', encoding='utf-8'))

          finais = resultados.get('resultados') or []
          assert int(resultados.get('total_resultados') or 0) == len(finais)
          assert all(str(j.get('event_id') or '').strip() for j in finais)
          assert len({str(j.get('event_id') or '') for j in finais}) == len(finais)
          assert apuracao.get('schema_version') == 4
          assert ranking.get('schema_version') == 4
          assert (apuracao.get('validacao_resultados') or {}).get('somente_finalizados') is True

          finais_por_rodada = {}
          for jogo in finais:
              rodada = int(jogo.get('rodada') or 0)
              if rodada:
                  finais_por_rodada.setdefault(rodada, set()).add(str(jogo.get('event_id') or ''))

          for rodada in apuracao.get('rodadas') or []:
              numero = int(rodada.get('rodada') or 0)
              if numero < 20 or not rodada.get('publicada'):
                  continue
              esperados = len(finais_por_rodada.get(numero, set()))
              assert int(rodada.get('jogos_apurados') or 0) == esperados, (
                  f'Rodada {numero}: apuração não acompanhou resultados finais '
                  f'({rodada.get("jogos_apurados")}/{esperados}).'
              )

          rodadas_por_numero = {int(r.get('rodada') or 0): r for r in apuracao.get('rodadas') or []}
          for bloco in apuracao.get('blocos') or []:
              if not bloco.get('publicada') or int(bloco.get('jogos_apurados') or 0) <= 0:
                  continue
              ini, fim = int(bloco.get('rodada_inicio') or 0), int(bloco.get('rodada_fim') or 0)
              ha_participantes = any(int((rodadas_por_numero.get(r) or {}).get('participantes') or 0) > 0 for r in range(ini, fim + 1))
              if ha_participantes:
                  assert bloco.get('ranking'), f'Bloco {ini}–{fim}: ranking vazio apesar de palpites e resultados publicados.'
          print('Resultado, apuração parcial e integridade dos rankings validados para publicação conjunta.')
          PY

      - name: Publicar snapshot essencial de resultado e bolão
        id: publish_essential
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO_MUDOU: ${{ steps.resultado_gate.outputs.mudou }}
          APURACAO_OUTCOME: ${{ steps.apurar_essencial.outcome }}
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "tabela.json"
            "espn_eventos.json"
            "jogos.json"
            "resultados.json"
            "dados-br/status-atualizacao.json"
          )
          # A sincronização dos blocos ocorre antes deste push. Preserve a auditoria
          # no snapshot essencial para que o reset robusto não a descarte na primeira
          # execução da Execução 21.
          if [[ -f dados-br/auditoria-blocos-apostas.json ]]; then
            FILES+=("dados-br/auditoria-blocos-apostas.json")
          fi

          # Caminho normal pós-FINAL: resultado e pontuação entram no MESMO commit.
          # Se o Supabase/apuração oscilar, o resultado não fica represado; o
          # orquestrador detectará a apuração defasada e chamará apurar-brasileirao.
          if [[ "${RESULTADO_MUDOU:-false}" == "true" && "${APURACAO_OUTCOME:-}" == "success" ]]; then
            FILES+=("dados-br/apuracao.json" "dados-br/ranking-apostas.json")
            MSG="Publicar resultado e apuração parcial"
          elif [[ "${RESULTADO_MUDOU:-false}" == "true" ]]; then
            MSG="Publicar resultado final; apuração pendente"
            echo "::warning::Apuração falhou; resultado será publicado e o orquestrador fará a recuperação."
          else
            MSG="Atualizar estado essencial do Brasileirão"
          fi

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Nenhuma mudança essencial para publicar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            test -f "$f"
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp -a "$f" "$TMP_DIR/$f"
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            for f in "${FILES[@]}"; do
              mkdir -p "$(dirname "$f")"
              cp -a "$TMP_DIR/$f" "$f"
            done
            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Outro run já publicou o mesmo snapshot essencial."
              exit 0
            fi
            git add -- "${FILES[@]}"
            git commit -m "$MSG - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Snapshot essencial publicado na tentativa $i."
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: não foi possível publicar o snapshot essencial."
          exit 1

      # O snapshot essencial é consumido diretamente do main pelas telas dinâmicas.
      # Não espere um GitHub Pages de ~200 MB para mostrar RESULTADOS/TABELA/BOLÃO.
      # O deploy completo continua no fim, somente para derivados/assets.

      - name: Informar preservação por dessincronia temporária da ESPN
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          ESPN_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          ESPN_MOTIVO: ${{ steps.espn.outputs.motivo }}
        run: |
          printf '::warning::A ESPN não sincronizou standings e scoreboard após %s tentativa(s).\n' "${ESPN_TENTATIVAS:-0}"
          printf '::warning::%s\n' "${ESPN_MOTIVO:-Motivo não informado pelo coletor.}"
          echo "O workflow termina com sucesso sem publicar arquivos parciais ou contraditórios."

      - name: Registrar falha de atualização e alertar por e-mail
        if: steps.espn.outputs.sincronizado != 'true'
        env:
          BR_STATUS: ${{ steps.espn.outputs.status }}
          BR_MOTIVO: ${{ steps.espn.outputs.motivo }}
          BR_FALLBACKS: ${{ steps.espn.outputs.fallbacks }}
          BR_TENTATIVAS: ${{ steps.espn.outputs.tentativas }}
          BR_SINCRONIZADO: ${{ steps.espn.outputs.sincronizado }}
          BR_WORKFLOW: Atualizar Brasileirao (ESPN)
          BR_SITE: Brasileirão 2026 Almoço
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Publicar somente o status preservado
        if: steps.espn.outputs.sincronizado != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATUS_FILE="dados-br/status-atualizacao.json"
          if [[ -z "$(git status --porcelain -- "$STATUS_FILE")" ]]; then
            echo "Status operacional sem alteração."
            exit 0
          fi
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TMP_DIR/dados-br"
          cp -a "$STATUS_FILE" "$TMP_DIR/$STATUS_FILE"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p dados-br
            cp -a "$TMP_DIR/$STATUS_FILE" "$STATUS_FILE"
            if [[ -z "$(git status --porcelain -- "$STATUS_FILE")" ]]; then
              echo "Outro run já publicou o mesmo status."
              exit 0
            fi
            git add -- "$STATUS_FILE"
            git commit -m "Registrar aviso operacional do Brasileirao - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "ERRO: não foi possível publicar o status preservado."
          exit 1

      - name: Gerar auditoria estrutural do calendário
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_calendario.py

      - name: Buscar estatísticas por jogo finalizado
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_detalhes_jogos_brasileirao.py --refresh-hours 48

      - name: Buscar líderes oficiais de gols e assistências
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/buscar_lideres_jogadores_espn.py

      - name: Gerar estatísticas e Ranking Vivo de desempenho
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_brasileirao.py

      - name: Atualizar competições que alteram as vagas continentais
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/atualizar_competicoes_af_previsao.py --max-age-minutes 45

      - name: Verificar se o estado esportivo exige novo AF-Previsão
        if: steps.espn.outputs.sincronizado == 'true'
        id: af_gate
        env:
          FORCAR_AF: ${{ inputs.forcar_af }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          arquivos = {
              'tabela': 'tabela.json',
              'resultados': 'resultados.json',
              'calendario': 'dados-br/calendario-completo.json',
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
              'config': 'dados-br/config-af-previsao.json',
              'bolao': 'dados-br/participantes-bolao-classificacao.json',
          }

          def carregar(caminho):
              path = Path(caminho)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if caminho == 'tabela.json':
                  return data.get('tabela') or []
              if caminho == 'resultados.json':
                  return data.get('resultados') or []
              if caminho.endswith('calendario-completo.json'):
                  return data.get('partidas') or data.get('jogos') or []
              if 'competicoes-af-previsao' in caminho:
                  return {
                      'status': data.get('status'),
                      'competicao': data.get('competicao'),
                      'fase_atual': data.get('fase_atual'),
                      'eventos': data.get('eventos') or [],
                  }
              return data

          estado = {chave: carregar(caminho) for chave, caminho in arquivos.items()}
          bruto = json.dumps(estado, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          depois = hashlib.sha256(bruto).hexdigest()
          antes_path = Path('/tmp/af_estado_antes.sha256')
          antes = antes_path.read_text(encoding='utf-8').strip() if antes_path.exists() else ''
          obrigatorios = [
              Path('dados-br/probabilidades-brasileirao.json'),
              Path('dados-br/probabilidades-por-pontuacao.json'),
              Path('dados-br/probabilidades-bolao.json'),
              Path('dados-br/probabilidades-jogos.json'),
          ]
          faltando = any(not item.exists() for item in obrigatorios)
          forcar = str(os.environ.get('FORCAR_AF', '')).lower() == 'true'
          executar = forcar or faltando or antes != depois

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_af={str(executar).lower()}\n')
              output.write(f'estado_antes={antes}\n')
              output.write(f'estado_depois={depois}\n')

          if forcar:
              motivo = 'execução manual com forcar_af=true'
          elif faltando:
              motivo = 'artefato obrigatório ausente'
          elif antes != depois:
              motivo = 'resultado, tabela, calendário, competição continental ou configuração mudou'
          else:
              motivo = 'nenhuma mudança esportiva relevante'
          print(f'Executar AF-Previsão: {executar} — {motivo}')
          PY

      - name: Gerar probabilidades pré-jogo de vitória, empate e derrota
        if: steps.espn.outputs.sincronizado == 'true' && steps.af_gate.outputs.run_af == 'true'
        run: python scripts/gerar_probabilidades_jogos.py

      - name: Gerar AF-Previsão integrado e simular o restante do campeonato
        if: steps.espn.outputs.sincronizado == 'true' && steps.af_gate.outputs.run_af == 'true'
        run: python scripts/gerar_probabilidades_brasileirao.py

      - name: Sincronizar histórico com o AF efetivamente publicado
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_probabilidades_brasileirao.py --sincronizar-historico-publicado

      - name: Auditar histórico e preparar avaliação final do AF-Previsão
        if: steps.espn.outputs.sincronizado == 'true' && steps.af_gate.outputs.run_af == 'true'
        run: python scripts/avaliar_af_previsao.py --strict

      - name: Informar preservação do último AF-Previsão
        if: steps.espn.outputs.sincronizado == 'true' && steps.af_gate.outputs.run_af != 'true'
        run: echo "Nenhuma mudança esportiva relevante; último AF-Previsão válido preservado sem repetir 2 milhões de simulações."

      - name: Gerar estatísticas gerais da competição
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_estatisticas_competicao_brasileirao.py

      - name: Auditar estatísticas do Brasileirão
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_estatisticas_brasileirao.py

      - name: Gerar auditoria de cobertura da aba Resultados
        if: steps.espn.outputs.sincronizado == 'true'
        run: python scripts/gerar_auditoria_cobertura_resultados.py

      - name: Gerar auditoria geral e alertar somente se crítico
        if: steps.espn.outputs.sincronizado == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python scripts/gerar_auditoria_geral.py --notify-critical

      - name: Conferir e validar JSONs gerados
        if: steps.espn.outputs.sincronizado == 'true'
        run: |
          set -euo pipefail
          echo "Arquivos JSON presentes e validos:"
          for arq in tabela.json espn_eventos.json jogos.json resultados.json dados-br/ajustes-calendario.json dados-br/resultados-manuais.json dados-br/publicos-complementares.json dados-br/status-atualizacao.json dados-br/calendario-completo.json dados-br/auditoria-calendario.json dados-br/auditoria-geral.json dados-br/auditoria-blocos-apostas.json dados-br/estatisticas.json dados-br/ranking-desempenho.json dados-br/historico-ranking-desempenho.json dados-br/auditoria-ranking-desempenho.json dados-br/jogadores.json dados-br/lideres-jogadores.json dados-br/auditoria-lideres-jogadores.json dados-br/jogos-detalhes.json dados-br/auditoria-jogos-detalhes.json dados-br/estatisticas-competicao.json dados-br/auditoria-estatisticas.json dados-br/auditoria-cobertura-resultados.json dados-br/competicoes-af-previsao/copa-do-brasil.json dados-br/competicoes-af-previsao/libertadores.json dados-br/competicoes-af-previsao/sul-americana.json dados-br/auditoria-competicoes-af-previsao.json dados-br/probabilidades-brasileirao.json dados-br/probabilidades-por-pontuacao.json dados-br/probabilidades-jogos.json dados-br/auditoria-probabilidades-jogos.json dados-br/probabilidades-bolao.json dados-br/participantes-bolao-classificacao.json dados-br/auditoria-probabilidades.json dados-br/historico-probabilidades.json dados-br/avaliacao-af-previsao.json; do
            if [ ! -f "$arq" ]; then
              echo "ERRO: $arq nao foi gerado."
              exit 1
            fi
            python -m json.tool "$arq" > /dev/null
            echo "  OK   $arq"
          done
          # A fonte principal permanece ESPN; fallbacks pontuais são registrados
          # por evento sem alterar a origem principal do snapshot.
          python - <<'PY'
          import json
          import math
          for arq in ['tabela.json', 'jogos.json', 'resultados.json']:
              d = json.load(open(arq, encoding='utf-8'))
              assert d.get('fonte') == 'ESPN', f'{arq}: fonte nao e ESPN'
          t = json.load(open('tabela.json', encoding='utf-8'))
          assert len(t.get('tabela') or []) == 20, 'tabela sem 20 times'
          j = json.load(open('jogos.json', encoding='utf-8'))
          assert isinstance(j.get('jogos'), list), 'jogos.json sem lista jogos'
          r = json.load(open('resultados.json', encoding='utf-8'))
          e = json.load(open('espn_eventos.json', encoding='utf-8'))
          assert isinstance(r.get('resultados'), list), 'resultados.json sem lista resultados'
          status_ops = json.load(open('dados-br/status-atualizacao.json', encoding='utf-8'))
          assert status_ops.get('status') in {'ok', 'aviso'}, 'status operacional incompatível com publicação sincronizada'
          assert status_ops.get('sincronizado') is True, 'status operacional não reconhece snapshot sincronizado'
          print('  OK   JSONs principais: ESPN como fonte principal; tabela com 20 times')
          stats = json.load(open('dados-br/estatisticas.json', encoding='utf-8'))
          rank = json.load(open('dados-br/ranking-desempenho.json', encoding='utf-8'))
          hist_rank = json.load(open('dados-br/historico-ranking-desempenho.json', encoding='utf-8'))
          assert len(stats.get('clubes') or []) == 20, 'estatisticas.json sem 20 clubes'
          assert len(rank.get('ranking') or []) == 20, 'ranking-desempenho.json sem 20 clubes'
          for item in rank.get('ranking') or []:
              for campo in ['indice_final', 'ataque', 'defesa', 'dominio', 'eficiencia', 'disciplina']:
                  assert campo in item, f'ranking sem campo {campo}'
          snapshots_rank = hist_rank.get('snapshots') or []
          assert hist_rank.get('schema_version') == 1, 'histórico do ranking com schema inválido'
          assert snapshots_rank and snapshots_rank[-1].get('id') == 'atual', 'histórico do ranking sem estado atual'
          assert len({item.get('id') for item in snapshots_rank}) == len(snapshots_rank), 'snapshots repetidos no histórico do ranking'
          for snapshot in snapshots_rank:
              linhas = snapshot.get('ranking') or []
              assert len(linhas) == 20, f"{snapshot.get('id')}: histórico sem 20 clubes"
              assert sorted(int(item.get('pos') or 0) for item in linhas) == list(range(1, 21)), f"{snapshot.get('id')}: posições inválidas"
              jogos_iguais = snapshot.get('jogos_por_clube')
              if jogos_iguais is not None:
                  assert all(int(item.get('jogos') or 0) == int(jogos_iguais) for item in linhas), f"{snapshot.get('id')}: amostras desiguais"
          campos_hist = ['time', 'pos', 'indice_final', 'ataque', 'defesa', 'dominio', 'eficiencia', 'disciplina', 'jogos']
          atual_hist = [{campo: item.get(campo) for campo in campos_hist} for item in snapshots_rank[-1]['ranking']]
          atual_rank = [{campo: item.get(campo) for campo in campos_hist} for item in rank['ranking']]
          assert atual_hist == atual_rank, 'snapshot atual diverge do ranking publicado'
          aud_rank = json.load(open('dados-br/auditoria-ranking-desempenho.json', encoding='utf-8'))
          assert aud_rank.get('clubes_no_ranking') == 20, 'auditoria-ranking sem 20 clubes'
          jogadores = json.load(open('dados-br/jogadores.json', encoding='utf-8'))
          assert isinstance(jogadores.get('artilharia'), list), 'jogadores.json sem artilharia'
          assert isinstance(jogadores.get('assistencias'), list), 'jogadores.json sem assistencias'
          assert isinstance(jogadores.get('participacoes_gol'), list), 'jogadores.json sem participacoes_gol'
          lideres = json.load(open('dados-br/lideres-jogadores.json', encoding='utf-8'))
          assert lideres.get('status') == 'valido', 'lideres-jogadores.json inválido'
          assert len(lideres.get('artilharia') or []) >= 40, 'artilharia completa truncada'
          assert len(lideres.get('assistencias') or []) >= 20, 'assistências completas truncadas'
          assert int(lideres['artilharia'][0].get('gols') or 0) > 0, 'líder de gols inválido'
          assert int(lideres['assistencias'][0].get('assistencias') or 0) > 0, 'líder de assistências inválido'
          assert len(jogadores.get('artilharia') or []) >= 40, 'jogadores.json sem artilharia completa'
          assert len(jogadores.get('assistencias') or []) >= 20, 'jogadores.json sem assistências completas'
          detalhes = json.load(open('dados-br/jogos-detalhes.json', encoding='utf-8'))
          assert isinstance(detalhes.get('jogos'), dict), 'jogos-detalhes.json sem objeto jogos'
          auditoria = json.load(open('dados-br/auditoria-jogos-detalhes.json', encoding='utf-8'))
          assert isinstance(auditoria.get('falhas'), list), 'auditoria-jogos-detalhes.json sem lista falhas'
          assert 'total_com_publico' in auditoria, 'auditoria-jogos-detalhes sem contagem de público'
          sem_stats_snapshot = sum(
              1 for item in (detalhes.get('jogos') or {}).values()
              if not (item.get('stats') or item.get('estatisticas'))
          )
          assert int(auditoria.get('total_sem_estatisticas_no_snapshot') or 0) == sem_stats_snapshot, (
              'auditoria-jogos-detalhes diverge da cobertura real de estatísticas: '
              f"audit={auditoria.get('total_sem_estatisticas_no_snapshot')} snapshot={sem_stats_snapshot}"
          )
          assert auditoria.get('total_inconsistencias_eventos') == 0, 'há gols/cartões inconsistentes'
          validados = int(detalhes.get('total_eventos_validados') or 0)
          pendentes = int(detalhes.get('total_eventos_pendentes_detalhes') or 0)
          assert validados + pendentes == detalhes.get('total_jogos'), 'há jogo sem eventos validados ou pendência segura declarada'
          from scripts.gerar_auditoria_estatisticas_brasileirao import tipo_pendencia_eventos_segura
          for event_id, item in (detalhes.get('jogos') or {}).items():
              validacao = item.get('validacao_eventos') or {}
              if validacao.get('pendente_detalhes') is True:
                  tipo_seguro = tipo_pendencia_eventos_segura(item)
                  assert tipo_seguro, (
                      f'{event_id}: pendência de detalhes não é uma pendência segura reconhecida: '
                      f'tipo={validacao.get("tipo_pendencia")!r} validacao={validacao}'
                  )
          competicao = json.load(open('dados-br/estatisticas-competicao.json', encoding='utf-8'))
          assert len(competicao.get('gols_por_clube') or []) == 20, 'estatísticas da competição sem 20 clubes'
          assert all(len(item.get('marcadores') or []) >= 5 for item in competicao.get('gols_por_clube') or []), 'há clube com menos de cinco marcadores'
          assert isinstance(competicao.get('sequencias'), dict), 'estatísticas da competição sem sequências'
          assert isinstance(competicao.get('performance_por_partida'), dict), 'estatísticas da competição sem performance'
          auditoria_stats = json.load(open('dados-br/auditoria-estatisticas.json', encoding='utf-8'))
          assert auditoria_stats.get('status') == 'ok', 'auditoria de estatísticas falhou'
          cobertura = json.load(open('dados-br/auditoria-cobertura-resultados.json', encoding='utf-8'))
          assert isinstance(cobertura.get('resumo'), dict), 'auditoria-cobertura-resultados.json sem resumo'
          calendario = json.load(open('dados-br/auditoria-calendario.json', encoding='utf-8'))
          assert isinstance(calendario.get('resumo'), dict), 'auditoria-calendario.json sem resumo'
          resumo_cal = calendario['resumo']
          assert resumo_cal.get('partidas_mapeadas_calendario_completo') == 380, 'calendário não tem 380 partidas'
          assert resumo_cal.get('rodadas_com_10_jogos') == 38, 'calendário não tem 38 rodadas íntegras'
          assert resumo_cal.get('clubes_com_38_jogos') == 20, 'há clube sem 38 jogos'
          assert resumo_cal.get('confrontos_com_ida_e_volta') == 190, 'ida e volta incompletas'
          auditoria_geral = json.load(open('dados-br/auditoria-geral.json', encoding='utf-8'))
          assert auditoria_geral.get('status') in {'ok', 'warning', 'critical'}, 'auditoria geral com status inválido'
          assert isinstance(auditoria_geral.get('criticos'), list), 'auditoria geral sem lista de críticos'
          assert isinstance(auditoria_geral.get('avisos'), list), 'auditoria geral sem lista de avisos'
          assert isinstance(auditoria_geral.get('resumo'), dict), 'auditoria geral sem resumo'
          assert not (auditoria_geral.get('rodadas_divergentes_por_artefato') or {}).get('eventos'), 'espn_eventos diverge da rodada canônica após atualização'
          assert not (auditoria_geral.get('rodadas_divergentes_por_artefato') or {}).get('jogos'), 'jogos.json diverge da rodada canônica após atualização'
          assert not (auditoria_geral.get('rodadas_divergentes_por_artefato') or {}).get('resultados'), 'resultados.json diverge da rodada canônica após atualização'
          completo = json.load(open('dados-br/calendario-completo.json', encoding='utf-8'))
          assert completo.get('total_partidas') == 380, 'calendario-completo.json sem 380 partidas'
          competicoes = {}
          for chave, arquivo in {
              'copa_do_brasil': 'dados-br/competicoes-af-previsao/copa-do-brasil.json',
              'libertadores': 'dados-br/competicoes-af-previsao/libertadores.json',
              'sul_americana': 'dados-br/competicoes-af-previsao/sul-americana.json',
          }.items():
              snapshot = json.load(open(arquivo, encoding='utf-8'))
              assert (snapshot.get('competicao') or {}).get('chave') == chave, f'{arquivo}: competição divergente'
              competicoes[chave] = snapshot
          aud_copas = json.load(open('dados-br/auditoria-competicoes-af-previsao.json', encoding='utf-8'))
          assert isinstance(aud_copas.get('competicoes'), list), 'auditoria continental sem competições'

          previsao = json.load(open('dados-br/probabilidades-brasileirao.json', encoding='utf-8'))
          assert previsao.get('status') == 'ok', 'AF-Previsão com status inválido'
          assert previsao.get('base_corrente', {}).get('partidas_totais') == 380, 'AF-Previsão sem 380 partidas'
          assert previsao.get('base_corrente', {}).get('partidas_concluidas') + previsao.get('base_corrente', {}).get('partidas_restantes') == 380, 'AF-Previsão com partição inválida'
          pontos_obj = json.load(open('dados-br/probabilidades-por-pontuacao.json', encoding='utf-8'))
          assert pontos_obj.get('status') == 'ok', 'probabilidades por pontuação inválidas'
          assert pontos_obj.get('simulacoes') == previsao.get('simulacao', {}).get('quantidade'), 'simulações divergentes na tabela por pontuação'
          niveis_pontos = pontos_obj.get('niveis') or []
          assert len(niveis_pontos) >= 7, 'níveis de pontuação insuficientes'
          assert pontos_obj.get('auditoria', {}).get('curvas_monotonicas') is True, 'curvas por pontuação não monotônicas'
          for campo in ['titulo', 'libertadores', 'sul_americana_ou_melhor', 'permanencia']:
              valores = [n.get(campo) for n in niveis_pontos if n.get(campo) is not None]
              assert valores == sorted(valores), f'cortes não monotônicos: {campo}'
              assert all(0 <= int(v) <= 114 for v in valores), f'corte fora da faixa: {campo}'
          clubes_prev = previsao.get('clubes') or []
          assert len(clubes_prev) == 20, 'AF-Previsão sem 20 clubes'
          assert previsao.get('total_previsoes_partidas') == previsao.get('base_corrente', {}).get('partidas_restantes'), 'AF-Previsão sem previsão para todos os jogos restantes'
          assert len(previsao.get('partidas_restantes') or []) == previsao.get('base_corrente', {}).get('partidas_restantes'), 'lista de partidas previstas incompleta'
          # Validação compatível com o schema publicado. O schema legado usa
          # Libertadores-base G6 (600%); o modelo continental usa a faixa definida
          # no config (atualmente G5 = 500%). Em caso de coleta inconsistente, o
          # gerador preserva o snapshot anterior e a trava deve validar a versão
          # preservada — não aplicar a regra de outro schema.
          schema_prev = int(previsao.get('schema_version') or 1)
          config_prev = json.load(open('dados-br/config-af-previsao.json', encoding='utf-8'))
          execucao_cfg = config_prev.get('execucao_2') or {}
          simulacoes_configuradas = int(execucao_cfg.get('simulacoes_monte_carlo') or 2000000)
          zonas_cfg = (execucao_cfg.get('zonas_base') or {})

          def tamanho_faixa(chave, legado):
              faixa = zonas_cfg.get(chave)
              if schema_prev < 2 or not isinstance(faixa, list) or len(faixa) != 2:
                  return legado
              inicio, fim = (int(faixa[0]), int(faixa[1]))
              assert 1 <= inicio <= fim <= 20, f'config AF inválida em {chave}: {faixa}'
              return fim - inicio + 1

          esperados = {
              'campeao': 100,
              'g4': 400,
              'g6': 600,
              'libertadores_base': 100 * tamanho_faixa('libertadores_base', 6),
              'sul_americana_base': 100 * tamanho_faixa('sul_americana_base', 6),
              'rebaixamento': 400,
          }
          for campo, esperado in esperados.items():
              total = sum(float(item['probabilidades_pct'][campo]) for item in clubes_prev)
              assert abs(total - esperado) <= 0.02, (
                  f'AF-Previsão schema {schema_prev}: soma inválida em {campo}: '
                  f'{total}; esperado {esperado}'
              )
          print(f'  OK   Somas AF-Previsão validadas conforme schema {schema_prev}: {esperados}')
          assert all(abs(sum(item.get('distribuicao_posicoes_pct') or []) - 100) <= 0.02 for item in clubes_prev), 'AF-Previsão: distribuição de posições inválida'

          integrado = previsao.get('schema_version', 0) >= 2 and (previsao.get('integracao_continental') or {}).get('status') == 'ok'
          snapshots_prontos = all(snapshot.get('status') == 'ok' and snapshot.get('eventos') for snapshot in competicoes.values())
          if integrado:
              assert snapshots_prontos, 'previsão integrada publicada com snapshots continentais inválidos'
              total_sula = sum(float(item['probabilidades_pct']['sul_americana']) for item in clubes_prev)
              assert abs(total_sula - 600) <= 0.02, f'Sul-Americana integrada não soma 600%: {total_sula}'
              for item in clubes_prev:
                  for campo in ('libertadores', 'sul_americana'):
                      detalhe = (item.get('probabilidades_detalhes') or {}).get(campo) or {}
                      simulacoes_detalhe = int(detalhe.get('simulacoes') or 0)
                      assert simulacoes_detalhe >= 200000, f'{item["clube"]}: detalhe sem amostra probabilística válida em {campo}'
                      if simulacoes_detalhe < simulacoes_configuradas:
                          print(f'::warning::{item["clube"]}: previsão preservada com {simulacoes_detalhe} simulações; a próxima publicação íntegra usará {simulacoes_configuradas}.')
                      assert isinstance(detalhe.get('exibicao'), str), f'{item["clube"]}: exibição ausente em {campo}'
                  decomposicao = item.get('decomposicao_chances') or {}
                  lib = decomposicao.get('libertadores') or {}
                  sula = decomposicao.get('sul_americana') or {}
                  assert abs(float(lib.get('soma_vias_pct', -1)) - float(item['probabilidades_pct']['libertadores'])) <= 0.002, f'{item["clube"]}: vias da Libertadores não fecham'
                  assert abs(float(sula.get('soma_vias_pct', -1)) - float(item['probabilidades_pct']['sul_americana'])) <= 0.002, f'{item["clube"]}: vias da Sul-Americana não fecham'
              print('  OK   AF-Previsão continental integrado e decomposto por via')
          else:
              # Estado transitório legítimo: os snapshots continentais podem estar
              # prontos enquanto a previsão publicada é a anterior (schema 1),
              # preservada pelo gerador quando os feeds da ESPN estão fora de
              # sincronia (ex.: resultado entrou em resultados.json mas a tabela
              # oficial ainda não computou os pontos). O estado preservado já é
              # validado acima: status ok, somas fechando e hash íntegro com a
              # auditoria. A integração acontece naturalmente na execução
              # seguinte, quando a ESPN sincroniza.
              if snapshots_prontos and aud_copas.get('status') == 'ok':
                  print('::warning::Snapshots continentais prontos; previsão anterior (schema 1) preservada aguardando sincronização da ESPN. Integração ocorrerá na próxima execução.')
              else:
                  print('::warning::AF-Previsão anterior preservado porque a coleta continental ainda não ficou íntegra')
          aud_prev = json.load(open('dados-br/auditoria-probabilidades.json', encoding='utf-8'))
          assert aud_prev.get('status') == 'ok', 'auditoria do AF-Previsão falhou'
          simulacoes_publicadas = int(aud_prev.get('simulacao', {}).get('quantidade') or 0)
          assert simulacoes_publicadas >= 200000, 'AF-Previsão sem amostra probabilística válida'
          if simulacoes_publicadas < simulacoes_configuradas:
              print(f'::warning::Último AF-Previsão válido preservado com {simulacoes_publicadas} simulações; alvo configurado atual: {simulacoes_configuradas}.')
          else:
              assert simulacoes_publicadas >= simulacoes_configuradas, 'AF-Previsão abaixo da quantidade configurada'
          assert aud_prev.get('simulacao', {}).get('convergencia', {}).get('maior_diferenca_entre_metades_pontos_percentuais', 99) <= 1.0, 'AF-Previsão sem convergência suficiente'
          assert aud_prev.get('hash_entrada') == previsao.get('hash_entrada'), 'hash divergente entre previsão e auditoria'
          if integrado:
              assert aud_prev.get('schema_version', 0) >= 2, 'auditoria integrada em schema antigo'
              assert isinstance(aud_prev.get('integracao_continental'), dict), 'auditoria sem integração continental'
          probabilidades_jogos = json.load(open('dados-br/probabilidades-jogos.json', encoding='utf-8'))
          auditoria_jogos = json.load(open('dados-br/auditoria-probabilidades-jogos.json', encoding='utf-8'))
          assert probabilidades_jogos.get('schema_version') == 1, 'probabilidades por jogo em schema inesperado'
          assert probabilidades_jogos.get('status') == 'ok', 'probabilidades por jogo com status inválido'
          assert probabilidades_jogos.get('tipo') == 'probabilidades_pre_jogo', 'tipo inválido nas probabilidades por jogo'
          assert isinstance(probabilidades_jogos.get('hash_entrada'), str) and probabilidades_jogos.get('hash_entrada'), 'hash de entrada ausente nas probabilidades por jogo'
          jogos_previstos = probabilidades_jogos.get('jogos') or []
          base_jogos = probabilidades_jogos.get('base_corrente') or {}
          assert int(probabilidades_jogos.get('total_jogos') or -1) == len(jogos_previstos), 'total divergente nas probabilidades por jogo'
          assert int(base_jogos.get('partidas_concluidas') or -1) + len(jogos_previstos) == 380, 'partição inválida nas probabilidades por jogo'
          assert int(base_jogos.get('partidas_restantes') or -1) == len(jogos_previstos), 'base corrente divergente nas probabilidades por jogo'
          ids_concluidos = {str(item.get('event_id') or item.get('id') or '') for item in (r.get('resultados') or [])}
          ids_espn_por_confronto = {}
          for item in (e.get('eventos') or []):
              event_id_espn = str(item.get('event_id') or '').strip()
              chave = (str(item.get('mandante') or ''), str(item.get('visitante') or ''))
              if event_id_espn and chave[0] and chave[1]:
                  assert chave not in ids_espn_por_confronto or ids_espn_por_confronto[chave] == event_id_espn, f'mais de um event_id ESPN para {chave}'
                  ids_espn_por_confronto[chave] = event_id_espn
          mapa_calendario = {}
          for item in (completo.get('jogos') or []):
              mandante = str(item.get('mandante') or '')
              visitante = str(item.get('visitante') or '')
              rodada = int(item.get('rodada') or 0)
              chave = (mandante, visitante)
              event_id = str(item.get('event_id') or '').strip() or ids_espn_por_confronto.get(chave) or f'AF-{rodada:02d}-{mandante}-{visitante}'
              assert event_id not in mapa_calendario, f'event_id duplicado no calendário: {event_id}'
              mapa_calendario[event_id] = (mandante, visitante)
          assert len(mapa_calendario) == 380, 'calendário sem 380 event_ids únicos/canônicos'
          ids_esperados = set(mapa_calendario) - ids_concluidos
          ids_jogos = [str(item.get('event_id') or '') for item in jogos_previstos]
          assert len(ids_jogos) == len(set(ids_jogos)), 'event_id duplicado nas probabilidades por jogo'
          assert set(ids_jogos) == ids_esperados, 'cobertura das probabilidades por jogo diverge do calendário restante'
          for item in jogos_previstos:
              event_id = str(item.get('event_id') or '')
              assert (str(item.get('mandante') or ''), str(item.get('visitante') or '')) == mapa_calendario[event_id], f'{event_id}: clubes divergentes do calendário'
              assert item.get('status') == 'pre_jogo', f'{event_id}: status não é pré-jogo'
              assert item.get('valido_ate') == 'inicio_da_partida', f'{event_id}: validade ausente'
              for bloco_nome in ('probabilidades_pct', 'probabilidades_exibicao_pct'):
                  bloco = item.get(bloco_nome) or {}
                  valores = [float(bloco.get(campo)) for campo in ('mandante', 'empate', 'visitante')]
                  assert all(math.isfinite(valor) and 0 <= valor <= 100 for valor in valores), f'{event_id}: probabilidade inválida em {bloco_nome}'
                  assert abs(sum(valores) - 100.0) <= 1e-9, f'{event_id}: {bloco_nome} não soma 100%'
              taxas = item.get('gols_esperados') or {}
              assert all(math.isfinite(float(taxas.get(campo))) and float(taxas.get(campo)) > 0 for campo in ('mandante', 'visitante')), f'{event_id}: taxa de gols inválida'
          assert auditoria_jogos.get('status') == 'ok', 'auditoria das probabilidades por jogo falhou'
          assert auditoria_jogos.get('hash_entrada') == probabilidades_jogos.get('hash_entrada'), 'hash de entrada divergente na auditoria por jogo'
          import hashlib
          payload_hash = hashlib.sha256(json.dumps(probabilidades_jogos, ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('utf-8')).hexdigest()
          assert auditoria_jogos.get('hash_saida') == payload_hash, 'hash de saída divergente na auditoria por jogo'
          assert int((auditoria_jogos.get('validacoes') or {}).get('jogos') or -1) == len(jogos_previstos), 'auditoria por jogo com cobertura divergente'
          print(f'  OK   Probabilidades pré-jogo: {len(jogos_previstos)} partidas; V/E/D fecham 100%')

          bolao = json.load(open('dados-br/probabilidades-bolao.json', encoding='utf-8'))
          participantes_bolao = json.load(open('dados-br/participantes-bolao-classificacao.json', encoding='utf-8'))
          assert bolao.get('status') == 'ok', 'projeção do bolão com status inválido'
          assert int(bolao.get('simulacoes') or 0) >= 200000, 'projeção do bolão sem amostra probabilística válida'
          nomes_config = {item.get('nome') for item in (participantes_bolao.get('participantes') or [])}
          linhas_bolao = bolao.get('participantes') or []
          assert len(linhas_bolao) == len(nomes_config) >= 2, 'projeção do bolão com participantes incompletos'
          assert {item.get('nome') for item in linhas_bolao} == nomes_config, 'nomes divergentes na projeção do bolão'
          soma_titulo_bolao = sum(float(item.get('chance_titulo_pct') or 0) for item in linhas_bolao)
          assert abs(soma_titulo_bolao - 100.0) <= 0.02, f'chances do bolão não somam 100%: {soma_titulo_bolao}'
          assert all(0 <= float(item.get('chance_top3_pct') or 0) <= 100 for item in linhas_bolao), 'chance top 3 inválida'
          assert all(0 <= float(item.get('chance_nao_pagar_pct') or 0) <= 100 for item in linhas_bolao), 'chance de não pagar inválida'
          print(f'  OK   AF-Previsão do bolão: {len(linhas_bolao)} participantes; título soma {soma_titulo_bolao:.6f}%')
          hist_prev = json.load(open('dados-br/historico-probabilidades.json', encoding='utf-8'))
          assert hist_prev.get('total_snapshots', 0) >= 1, 'histórico do AF-Previsão vazio'
          assert hist_prev.get('schema_version', 0) >= 4, 'histórico sem deduplicação por resultado e referência por clube'
          estado_publicado = hist_prev.get('estado_publicado') or {}
          assert estado_publicado.get('hash_entrada') == previsao.get('hash_entrada'), (
              'histórico não referencia a publicação corrente: '
              f"historico={estado_publicado.get('hash_entrada')} previsao={previsao.get('hash_entrada')}"
          )
          assert estado_publicado.get('hash_estado_esportivo'), 'histórico sem hash do estado de resultados concluídos'
          estados_historicos = [item.get('hash_estado_esportivo') for item in (hist_prev.get('snapshots') or [])]
          assert all(estados_historicos) and len(estados_historicos) == len(set(estados_historicos)), 'histórico contém estados esportivos repetidos'
          integridade_hist = hist_prev.get('integridade') or {}
          assert integridade_hist.get('encadeamento_valido') is True, 'histórico sem integridade declarada'
          assert integridade_hist.get('hash_final') == (hist_prev.get('snapshots') or [])[-1].get('hash_snapshot'), 'hash final do histórico divergente'
          avaliacao = json.load(open('dados-br/avaliacao-af-previsao.json', encoding='utf-8'))
          assert avaliacao.get('status') in {'coletando_historico', 'aguardando_resultados_continentais', 'avaliacao_concluida', 'avaliacao_concluida_amostra_reduzida'}, 'status inválido da avaliação AF'
          assert (avaliacao.get('integridade_historico') or {}).get('valido') is True, 'avaliação detectou histórico inválido'
          assert (avaliacao.get('integridade_historico') or {}).get('encadeado') is True, 'avaliação não reconheceu a cadeia do histórico'
          print('  OK   Estatísticas, calendário e AF-Previsão gerados')
          PY

      # Estratégia de push robusta e padronizada:
      # guarda os artefatos gerados -> fetch + reset --hard origin/main ->
      # reaplica os arquivos -> commit -> push. Nunca gera conflito artificial
      # de rebase em arquivos-artefato, mesmo sob concorrencia real.
      - name: Commitar JSONs juntos com push robusto
        id: publish_full
        if: steps.espn.outputs.sincronizado == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            "tabela.json"
            "espn_eventos.json"
            "jogos.json"
            "resultados.json"
            "dados-br/status-atualizacao.json"
            "dados-br/apuracao.json"
            "dados-br/ranking-apostas.json"
            "dados-br/estatisticas.json"
            "dados-br/ranking-desempenho.json"
            "dados-br/historico-ranking-desempenho.json"
            "dados-br/auditoria-ranking-desempenho.json"
            "dados-br/jogadores.json"
            "dados-br/lideres-jogadores.json"
            "dados-br/auditoria-lideres-jogadores.json"
            "dados-br/jogos-detalhes.json"
            "dados-br/auditoria-jogos-detalhes.json"
            "dados-br/estatisticas-competicao.json"
            "dados-br/auditoria-estatisticas.json"
            "dados-br/auditoria-cobertura-resultados.json"
            "dados-br/calendario-completo.json"
            "dados-br/auditoria-calendario.json"
            "dados-br/auditoria-geral.json"
            "dados-br/auditoria-blocos-apostas.json"
            "dados-br/competicoes-af-previsao/copa-do-brasil.json"
            "dados-br/competicoes-af-previsao/libertadores.json"
            "dados-br/competicoes-af-previsao/sul-americana.json"
            "dados-br/auditoria-competicoes-af-previsao.json"
            "dados-br/probabilidades-brasileirao.json"
            "dados-br/probabilidades-por-pontuacao.json"
            "dados-br/probabilidades-jogos.json"
            "dados-br/auditoria-probabilidades-jogos.json"
            "dados-br/probabilidades-bolao.json"
            "dados-br/auditoria-probabilidades.json"
            "dados-br/historico-probabilidades.json"
            "dados-br/avaliacao-af-previsao.json"
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "Sem mudancas nos JSONs - nada a commitar."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            if [[ -e "$f" ]]; then
              mkdir -p "$TMP_DIR/$(dirname "$f")"
              cp -a "$f" "$TMP_DIR/$f"
            fi
          done

          for i in 1 2 3 4 5; do
            echo "Tentativa de push $i/5..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            for f in "${FILES[@]}"; do
              if [[ -e "$TMP_DIR/$f" ]]; then
                rm -rf "$f"
                mkdir -p "$(dirname "$f")"
                cp -a "$TMP_DIR/$f" "$f"
              fi
            done

            if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
              echo "Apos atualizar com origin/main, nada mudou - sem commit."
              exit 0
            fi

            git add -- "${FILES[@]}"
            git commit -m "Atualizar dados auditados do Brasileirao - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $i."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado na tentativa $i; recalculando sobre origin/main mais recente..."
            sleep 3
          done

          echo "ERRO: Push falhou apos 5 tentativas."
          exit 1

      - name: Deploy dos derivados completos
        if: steps.publish_full.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "Deploy disparado para AF, estatísticas e demais derivados atualizados."


  # Job de alerta de falha crítica — substitui o Monitorar (workflow_run).
  # Roda apenas quando o job principal falha; não ocupa repo-write-main.
  alertar_falha:
    name: Alertar falha crítica por e-mail
    needs: atualizar
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout mínimo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enviar alerta de falha
        env:
          BR_STATUS: erro
          BR_MOTIVO: "O workflow Atualizar Brasileirão terminou com falha. O último snapshot íntegro permanece publicado."
          BR_FALLBACKS: '[]'
          BR_TENTATIVAS: '0'
          BR_SINCRONIZADO: 'false'
          BR_WORKFLOW: 'Atualizar Brasileirao (ESPN)'
          BR_SITE: 'Brasileirão 2026 Almoço'
          BR_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BR_SOURCE_RUN_ID: "${{ github.run_id }}"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python scripts/gerenciar_status_brasileirao.py --from-env --notify

      - name: Persistir status da falha e controle de deduplicação
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATUS_FILE="dados-br/status-atualizacao.json"
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TMP_DIR/dados-br"
          cp -a "$STATUS_FILE" "$TMP_DIR/$STATUS_FILE"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p dados-br
            cp -a "$TMP_DIR/$STATUS_FILE" "$STATUS_FILE"

            if [[ -z "$(git status --porcelain -- "$STATUS_FILE")" ]]; then
              echo "O mesmo status de falha já está publicado; nenhum commit necessário."
              exit 0
            fi

            git add -- "$STATUS_FILE"
            git commit -m "Registrar falha do Atualizar Brasileirao - $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')"
            if git push origin HEAD:main; then
              echo "Status de falha publicado e deduplicação persistida."
              exit 0
            fi
            sleep 3
          done

          echo "::warning::Não foi possível persistir o status da falha após 5 tentativas."
          exit 0
