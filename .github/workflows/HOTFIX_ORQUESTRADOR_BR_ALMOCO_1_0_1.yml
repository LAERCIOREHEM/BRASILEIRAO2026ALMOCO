name: HOTFIX · Orquestrador BR Almoço 1.0.1R

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar HEAD atual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar que o workflow de deploy 1.0.1 foi atualizado manualmente
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'assert d.get("version")=="1.0.1"' .github/workflows/deploy-orchestrator-br-almoco.yml >/dev/null
          grep -F '## Orchestrator BR Almoço 1.0.1' .github/workflows/deploy-orchestrator-br-almoco.yml >/dev/null
          echo "Workflow de deploy 1.0.1: OK"

      - name: Aplicar HOTFIX sobre os arquivos atuais
        run: python scripts/aplicar_hotfix_orquestrador_br_almoco_1_0_1.py

      - name: Validar exaustivamente antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/orchestrator-br-almoco
          npm run validate
          cd "$GITHUB_WORKSPACE"
          node --check cloudflare/orchestrator-br-almoco/src/index.js
          python - <<'PY'
          import json, pathlib
          assert json.loads(pathlib.Path('cloudflare/orchestrator-br-almoco/package.json').read_text(encoding='utf-8')).get('version') == '1.0.1'
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'const ESPN_LIVE_DISABLED = true;' in s
          assert 'ESPN · resultado recém-finalizado' not in s
          w=pathlib.Path('cloudflare/orchestrator-br-almoco/wrangler.toml').read_text(encoding='utf-8')
          assert 'FINAL_RECOVERY_END_MINUTES = "1440"' in w
          assert 'FINAL_RETRY_MINUTES = "15"' in w
          print('Gates estáticos 1.0.1R: OK')
          PY
          git diff --check

      - name: Publicar somente arquivos NÃO-workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # CRÍTICO: este Action NÃO cria, edita nem remove qualquer arquivo em
          # .github/workflows. Assim o GITHUB_TOKEN padrão não precisa de
          # permissão especial de workflows.
          git add \
            cloudflare/orchestrator-br-almoco/src/index.js \
            cloudflare/orchestrator-br-almoco/test/orchestrator.test.mjs \
            cloudflare/orchestrator-br-almoco/package.json \
            cloudflare/orchestrator-br-almoco/wrangler.toml \
            cloudflare/orchestrator-br-almoco/README.md \
            index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração de produção pendente; HOTFIX possivelmente já aplicado."
            exit 0
          fi

          git commit -m "Corrigir convergência de resultados finais no orquestrador"
          git push origin HEAD:main
