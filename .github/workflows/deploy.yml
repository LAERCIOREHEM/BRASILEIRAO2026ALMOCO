name: Deploy site (GitHub Pages)

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - '*.html'
      - 'CNAME'
      - '*.json'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.ico'
      - 'favicon*'
      - 'apple-touch-icon.png'
      - 'img/**'
      - 'css/**'
      - 'js/**'
      - 'dados-br/**'
      - 'copa2026/**'
      - 'docs/**'
      - 'jogos/**'
      - 'tabela/**'
      - 'resultados/**'
      - 'bolao/**'
      - 'aniversariantes/**'
      - '.github/workflows/deploy.yml'

  # Publica imediatamente após workflows que atualizam dados do site.
  # Isso cobre commits feitos por GitHub Actions, que nem sempre disparam outro
  # workflow por "push" usando GITHUB_TOKEN.
  workflow_run:
    workflows:
      - 'Atualizar Brasileirao (ESPN)'
      - 'Buscar transmissões ao vivo do Brasileirão'
      - 'Buscar melhores momentos Brasileirão oficiais'
      - 'Atualizar Elencos Brasileirao (ESPN)'
      - 'Revisar melhores momentos Brasileirão oficiais'
      - 'Apurar Apostas Brasileirão'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# ATENCAO - NAO VOLTE cancel-in-progress PARA true.
#
# O passo actions/deploy-pages cria uma implantacao do lado do GitHub Pages
# (POST /pages/deployments) e depois fica apenas consultando o status. Se o run
# for cancelado pela concorrencia no meio dessa espera, a implantacao ja criada
# NAO e cancelada junto: ela fica pendurada na fila do Pages, que e serial por
# repositorio. A partir dai todo deploy seguinte fica preso em
# "deployment_queued" ate estourar o tempo limite do proprio actions/deploy-pages
# ("Timeout reached, aborting!"), o que cancela mais um run e realimenta o
# travamento.
#
# Comportamento correto (mesmo do workflow oficial do GitHub Pages): deixar o
# run em execucao terminar e manter apenas o run enfileirado mais recente. O
# GitHub ja descarta automaticamente os runs pendentes intermediarios, entao nao
# ha acumulo de fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.name == 'Atualizar Brasileirao (ESPN)'))

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar site estatico limpo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Arquivos de raiz que precisam ser publicados.
          # IMPORTANTE: apos o Brasileirão v2, as paginas apostas/estatisticas/clubes/museu/regras
          # tambem ficam na raiz. Antes o deploy copiava só index.html, causando 404 nessas paginas.
          for item in *.html CNAME robots.txt sitemap.xml \
            tabela.json resultados.json jogos.json membros.json \
            espn_eventos.json transmissoes.json \
            favicon.ico favicon-16.png favicon-32.png favicon-96.png favicon-192.png favicon-512.png \
            apple-touch-icon.png og-image.png og-image-publico-v3.png og-image-whatsapp-v2.png og-image-aovivo-v2.jpg; do
            if [[ -e "$item" ]]; then
              cp -a "$item" _site/
            fi
          done

          # Assets e dados usados pelas paginas novas do Brasileirão.
          # Rotas limpas são diretórios estáticos. Sem copiá-las para _site,
          # o GitHub Pages responde 404 mesmo que existam no repositório.
          for dir in img css js dados-br copa2026 docs jogos tabela resultados bolao aniversariantes; do
            if [[ -d "$dir" ]]; then
              cp -a "$dir" _site/
            fi
          done

          touch _site/.nojekyll

          # Estado do próprio deploy, publicado no artefato para o painel admin.
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          site = Path('_site')
          digest = hashlib.sha256()
          for rel in ('tabela.json', 'resultados.json', 'jogos.json', 'espn_eventos.json'):
              path = site / rel
              digest.update(rel.encode('utf-8'))
              if path.exists():
                  digest.update(path.read_bytes())
          run_url = ''
          if os.environ.get('GITHUB_REPOSITORY') and os.environ.get('GITHUB_RUN_ID'):
              run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com').rstrip('/')}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = {
              'schema_version': 1,
              'site': 'Brasileirão 2026 Almoço',
              'workflow': 'Deploy GitHub Pages',
              'status': 'ok',
              'nivel': 'normal',
              'publicado_em': datetime.now(timezone(timedelta(hours=-3))).replace(microsecond=0).isoformat(),
              'snapshot_hash_artefato': digest.hexdigest(),
              'source_commit': os.environ.get('GITHUB_SHA', ''),
              'run_url': run_url,
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
          }
          target = site / 'dados-br' / 'status-deploy.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar pacote estatico antes do upload
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f _site/index.html ]]; then
            echo "ERRO: _site/index.html nao encontrado."
            exit 1
          fi

          # Trava especifica do Brasileirao v2: estas paginas e assets precisam
          # entrar no artefato publicado; se ficarem fora, o site abre a home,
          # mas /apostas.html, /estatisticas.html, /clubes.html e /museu.html dao 404.
          REQUIRED_BR=(
            "_site/apostas.html"
            "_site/desafios-mesa.html"
            "_site/aovivo.html"
            "_site/estatisticas.html"
            "_site/clubes.html"
            "_site/museu.html"
            "_site/regras.html"
            "_site/css/br-apostas.css"
            "_site/css/br-desafios-mesa.css"
            "_site/css/br-estatisticas.css"
            "_site/css/br-aovivo.css"
            "_site/css/br-institucional.css"
            "_site/js/br-apostas.js"
            "_site/js/br-desafios-mesa.js"
            "_site/js/br-aovivo.js"
            "_site/js/br-estatisticas.js"
            "_site/js/br-clubes.js"
            "_site/js/br-museu.js"
            "_site/dados-br/apostas-config.json"
            "_site/dados-br/ajustes-calendario.json"
            "_site/dados-br/calendario-completo.json"
            "_site/dados-br/auditoria-calendario.json"
            "_site/dados-br/status-atualizacao.json"
            "_site/dados-br/status-deploy.json"
            "_site/dados-br/transmissoes-tv.json"
            "_site/dados-br/clubes.json"
            "_site/dados-br/museu-brasileirao.json"
            "_site/jogos/index.html"
            "_site/tabela/index.html"
            "_site/resultados/index.html"
            "_site/bolao/index.html"
            "_site/aniversariantes/index.html"
          )
          for f in "${REQUIRED_BR[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "ERRO: arquivo obrigatório do Brasileirão v2 fora do deploy: $f"
              exit 1
            fi
          done
          echo "OK: paginas, assets e rotas limpas do Brasileirao v2 incluidos no pacote estatico."

          python - <<'PY'
          from pathlib import Path

          rotas = {
              'jogos': 'jogos',
              'tabela': 'tabela',
              'resultados': 'resultados',
              'bolao': 'rank',
              'aniversariantes': 'aniversariantes',
          }
          for rota, view in rotas.items():
              arquivo = Path('_site') / rota / 'index.html'
              texto = arquivo.read_text(encoding='utf-8')
              esperado = f'view={view}'
              assert esperado in texto, f'{arquivo}: redirecionamento divergente; esperado {esperado}'

          index = Path('_site/index.html').read_text(encoding='utf-8')
          menu = Path('_site/js/br-menu.js').read_text(encoding='utf-8')
          apostas = Path('_site/js/br-apostas.js').read_text(encoding='utf-8')
          assert "aniversariantes: '/aniversariantes'" in index, 'index sem rota limpa de aniversariantes'
          assert '"/aniversariantes": "aniversariantes"' in menu, 'menu sem leitura da rota de aniversariantes'
          assert 'aniversariantes: "/aniversariantes"' in menu, 'menu sem URL limpa de aniversariantes'
          assert 'path === "/bolao" || path === "/aniversariantes"' in apostas, 'login sem retorno seguro para as rotas privadas limpas'

          paginas_menu = ['aovivo.html', 'apostas.html', 'clubes.html', 'estatisticas.html', 'museu.html', 'regras.html']
          legado = '?brasileirao=1&view='
          for pagina in paginas_menu:
              texto = (Path('_site') / pagina).read_text(encoding='utf-8')
              assert legado not in texto, f'{pagina}: menu ainda contém URL legada'
              for rota in ('/jogos', '/tabela', '/resultados', '/bolao', '/aniversariantes'):
                  assert f'href="{rota}"' in texto, f'{pagina}: link limpo ausente para {rota}'
          print('OK: rotas limpas, proteção privada, retorno pós-login e menus conferidos.')
          PY

          if find _site -type l | grep -q .; then
            echo "ERRO: existem symlinks dentro de _site."
            find _site -type l
            exit 1
          fi

          echo "Total de arquivos:"
          find _site -type f | wc -l

          echo "Tamanho total:"
          du -sh _site

          echo "Maiores arquivos:"
          find _site -type f -printf '%s %p\n' > /tmp/site-files.txt
          sort -nr /tmp/site-files.txt > /tmp/site-files-sorted.txt
          head -20 /tmp/site-files-sorted.txt | awk '{printf "%.2f MB  %s\n", $1/1024/1024, $2}'

          # Guarda de peso do artefato. Pacote muito grande e a segunda causa de
          # "deployment_queued" longo: o Pages demora para descompactar e servir.
          BYTES=$(du -sb _site | cut -f1)
          MB=$((BYTES / 1024 / 1024))
          echo "Peso do artefato: ${MB} MB"
          if (( MB > 400 )); then
            echo "ERRO: artefato com ${MB} MB (limite operacional 400 MB)."
            echo "Rode 'python scripts/otimizar_imagens.py' e comite as imagens otimizadas."
            exit 1
          fi
          if (( MB > 120 )); then
            echo "::warning::Artefato com ${MB} MB. Acima de 120 MB o deploy do Pages fica lento; considere rodar scripts/otimizar_imagens.py."
          fi

      # CAUSA MAIS PROVAVEL do "deployment_queued" que nunca sai do lugar.
      #
      # Se a origem do Pages ("Source") estiver em "Deploy from a branch", o
      # servico so processa implantacoes vindas do workflow embutido
      # "pages build and deployment". Uma implantacao criada por
      # actions/deploy-pages simplesmente NAO e retirada da fila: fica em
      # deployment_queued ate o action desistir. O log nao acusa erro de
      # configuracao — apenas repete o status, exatamente como observado.
      #
      # actions/configure-pages NAO resolve: com enablement no padrao (false)
      # ele apenas le as configuracoes, sem alterar o build_type.
      - name: Fixar origem do Pages em GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          echo "--- Configuracao atual do Pages ---"
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{build_type, status, html_url, source}' 2>/dev/null || echo "(nao foi possivel ler /pages)"

          atual=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "desconhecido"' 2>/dev/null || echo "sem_pages")
          echo "build_type atual: ${atual}"

          if [[ "$atual" == "workflow" ]]; then
            echo "OK: origem ja e GitHub Actions."
            exit 0
          fi

          echo "::warning::Origem do Pages em '${atual}'. Tentando corrigir para 'workflow'."
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Origem corrigida para GitHub Actions."
            sleep 10
            exit 0
          fi

          # Falha rapida e explicita: seguir daqui so gastaria 10 min de fila
          # para terminar no mesmo "Timeout reached, aborting!".
          echo "ERRO: a origem do GitHub Pages NAO esta em 'GitHub Actions' e o GITHUB_TOKEN"
          echo "      nao tem permissao para alterar essa configuracao."
          echo ""
          echo "CORRIJA MANUALMENTE, uma unica vez:"
          echo "  Settings > Pages > Build and deployment > Source = GitHub Actions"
          echo ""
          echo "Enquanto isso nao for feito, toda implantacao criada por este workflow"
          echo "ficara presa em 'deployment_queued' ate estourar o tempo limite."
          exit 1

      - name: Destravar fila do Pages (cancelar deploys presos)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          # Cancela implantacoes do ambiente github-pages que ficaram presas em
          # queued/in_progress por mais de 10 minutos (heranca de runs cancelados).
          # Enquanto elas existirem, a fila serial do Pages nao anda e este deploy
          # tambem ficaria em "deployment_queued" ate estourar o tempo limite.
          LIMITE=$(date -u -d '10 minutes ago' +%s)
          PRESOS=0

          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" \
            --jq '.[] | [.id, .sha, .created_at] | @tsv' > /tmp/deployments.tsv || exit 0

          while IFS=$'\t' read -r id sha criado; do
            [[ -z "${id:-}" ]] && continue
            [[ "$sha" == "$GITHUB_SHA" ]] && continue

            estado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" \
              --jq '.[0].state // "sem_status"' 2>/dev/null || echo "sem_status")

            case "$estado" in
              queued|in_progress|pending|waiting) ;;
              *) continue ;;
            esac

            nascido=$(date -u -d "$criado" +%s 2>/dev/null || echo 0)
            if (( nascido == 0 || nascido > LIMITE )); then
              continue
            fi

            echo "Cancelando implantacao presa: id=${id} sha=${sha} estado=${estado} criada_em=${criado}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" >/dev/null 2>&1 \
              || echo "  (nao foi possivel cancelar ${sha}; seguindo assim mesmo)"
            PRESOS=$((PRESOS + 1))
          done < /tmp/deployments.tsv

          if (( PRESOS == 0 )); then
            echo "Fila do Pages limpa: nenhuma implantacao presa encontrada."
          else
            echo "Implantacoes presas canceladas: ${PRESOS}. Aguardando a fila liberar."
            sleep 20
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        # ATENCAO: 600000 ms (10 min) e o MAXIMO aceito pelo actions/deploy-pages.
        # Valores maiores sao silenciosamente reduzidos e o log emite
        # "timeout value is greater than the allowed maximum". Nao adianta subir
        # aqui: para deploys lentos, a saida e reduzir o artefato e repetir.
        timeout-minutes: 12
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000

      - name: Aguardar antes de repetir deploy
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Repetir deploy no GitHub Pages
        id: deployment_retry
        continue-on-error: true
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 12
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000

      - name: Aguardar antes da ultima tentativa
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        shell: bash
        run: sleep 120

      # Terceira e ultima tentativa: sem continue-on-error, falha aqui reprova o
      # job e dispara o alerta por e-mail.
      - name: Ultima tentativa de deploy no GitHub Pages
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 12
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 5000

      - name: Alertar falha de deploy por e-mail
        if: failure()
        continue-on-error: true
        env:
          BR_MOTIVO: Falha no deploy do GitHub Pages. O site continua exibindo a última versão publicada com sucesso.
          BR_WORKFLOW: Deploy GitHub Pages
          BR_SITE: Brasileirão 2026 Almoço
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python scripts/gerenciar_status_brasileirao.py --error --notify
