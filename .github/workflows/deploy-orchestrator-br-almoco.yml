name: Deploy Orchestrator BR Almoço
run-name: Orchestrator BR Almoço · ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'shadow = decide sem disparar; active = produção'
        required: true
        default: 'shadow'
        type: choice
        options:
          - shadow
          - active

permissions:
  contents: read

concurrency:
  group: br-almoco-orchestrator-deploy
  cancel-in-progress: false

jobs:
  validar-e-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar secrets EXCLUSIVOS deste projeto
        env:
          CF_TOKEN: ${{ secrets.BR_ALMOCO_CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.BR_ALMOCO_CF_ACCOUNT_ID }}
          ORQ_GH_TOKEN: ${{ secrets.BR_ALMOCO_ORCHESTRATOR_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" ]] || { echo "Falta BR_ALMOCO_CF_API_TOKEN" >&2; exit 1; }
          [[ -n "${CF_ACCOUNT:-}" ]] || { echo "Falta BR_ALMOCO_CF_ACCOUNT_ID" >&2; exit 1; }
          [[ -n "${ORQ_GH_TOKEN:-}" ]] || { echo "Falta BR_ALMOCO_ORCHESTRATOR_GITHUB_TOKEN" >&2; exit 1; }
          echo "Secrets exclusivos do BR Almoço presentes. Nenhum secret do Fórmula do Gol é referenciado por este workflow."

      - name: Testar PAT exclusivo do GitHub em leitura
        env:
          ORQ_GH_TOKEN: ${{ secrets.BR_ALMOCO_ORCHESTRATOR_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          HDR=(-H "Authorization: Bearer ${ORQ_GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10")
          curl -fsS "${HDR[@]}" "${API}/contents/dados-br/calendario-completo.json?ref=main" >/dev/null
          curl -fsS "${HDR[@]}" "${API}/actions/workflows?per_page=100" >/dev/null
          echo "PAT: Contents read + Actions read confirmados. Actions write será usado somente pelo Worker via workflow_dispatch."

      - name: Validar motor e configuração Wrangler
        working-directory: cloudflare/orchestrator-br-almoco
        run: |
          set -euo pipefail
          npm run validate
          python - <<'PY'
          from pathlib import Path
          s = Path('../../index.html').read_text(encoding='utf-8')
          assert 'const ESPN_LIVE_DISABLED = true;' in s
          assert 'ESPN · resultado recém-finalizado' not in s
          fn = s.split('function resultadosComFinaisRecentesESPN(listaBase) {', 1)[1].split('\n}', 1)[0]
          assert 'state.espnLive' not in fn
          print('Browser AO VIVO residual: desativado; Resultados = snapshot consolidado')
          PY
          npx --yes wrangler@4.128.0 --version
          npx --yes wrangler@4.128.0 deploy --dry-run --config wrangler.toml --outdir /tmp/br-almoco-wrangler-dry-run

      - name: Preparar modo solicitado sem alterar o repositório
        working-directory: cloudflare/orchestrator-br-almoco
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          p=pathlib.Path('wrangler.toml')
          s=p.read_text(encoding='utf-8')
          mode=os.environ['MODE']
          assert mode in {'shadow','active'}
          s2,n=re.subn(r'^ORCHESTRATOR_MODE\s*=\s*"(?:shadow|active)"$', f'ORCHESTRATOR_MODE = "{mode}"', s, count=1, flags=re.M)
          assert n == 1
          pathlib.Path('wrangler.deploy.toml').write_text(s2, encoding='utf-8')
          print(f'Modo de deploy: {mode}')
          PY

      - name: Deploy Worker/DO EXCLUSIVOS do Brasileirão Almoço
        id: deploy
        working-directory: cloudflare/orchestrator-br-almoco
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BR_ALMOCO_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BR_ALMOCO_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy --config wrangler.deploy.toml 2>&1 | tee /tmp/br-almoco-wrangler-deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/br-almoco-wrangler-deploy.log | head -n1 || true)"
          if [[ -n "$URL" ]]; then
            echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
            echo "Worker URL: $URL"
          else
            echo "Não foi possível extrair workers.dev do log; o deploy ainda pode ter sido concluído."
          fi

      - name: Gravar PAT exclusivo como secret do Worker
        working-directory: cloudflare/orchestrator-br-almoco
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BR_ALMOCO_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BR_ALMOCO_CF_ACCOUNT_ID }}
          ORQ_GH_TOKEN: ${{ secrets.BR_ALMOCO_ORCHESTRATOR_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ORQ_GH_TOKEN" | npx --yes wrangler@4.128.0 secret put GITHUB_TOKEN --config wrangler.deploy.toml

      - name: Verificar health quando workers.dev estiver disponível
        if: ${{ steps.deploy.outputs.worker_url != '' }}
        env:
          URL: ${{ steps.deploy.outputs.worker_url }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          BODY="$(curl -fsS --retry 6 --retry-delay 2 "$URL/health")"
          echo "$BODY"
          printf '%s' "$BODY" | python -c 'import json,sys,os; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("version")=="1.0.1"; assert d.get("mode")==os.environ["MODE"]; assert d.get("liveIgnored") is True; print("health validado")'

      - name: Resumo operacional
        env:
          URL: ${{ steps.deploy.outputs.worker_url }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          {
            echo "## Orchestrator BR Almoço 1.0.1"
            echo ""
            echo "- **Modo:** \`${MODE}\`"
            echo "- **Worker:** \`brasileirao-almoco-orchestrator\`"
            echo "- **Durable Object:** \`BrAlmocoOrchestratorStateV1\`"
            echo "- **Site no GitHub Pages:** inalterado"
            echo "- **AO VIVO/públicos/MM/elencos/fair play:** fora do escopo"
            if [[ -n "${URL:-}" ]]; then
              echo "- **Health:** ${URL}/health"
              echo "- **Status:** ${URL}/status"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
